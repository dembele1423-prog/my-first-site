<head>

<title>نظام فحص الصهاريج اليومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --navy:#0f2a43; --navy-2:#173a5e; --steel:#3d5a76; --paper:#f4f6f8; --card:#ffffff;
  --line:#dfe6ec; --ink:#14202b; --sub:#5b6b78; --amber:#c8790c; --amber-bg:#fdf1de;
  --green:#1f7a4d; --green-bg:#e7f5ee; --red:#b23b3b; --red-bg:#fbeaea; --gold:#b98a2e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100%;-webkit-font-smoothing:antialiased;}
.topbar{background:var(--navy);color:#fff;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(15,42,67,.18);}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#8a6a1f);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);font-size:16px;flex:none;}
.brand .name{font-weight:700;font-size:16px;line-height:1.2}
.brand .name small{display:block;font-weight:400;font-size:11px;color:#c9d6e2}
.topbar .who{display:flex;align-items:center;gap:10px;font-size:13px}
.topbar .who .role-tag{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:3px 10px;border-radius:20px;font-size:11px;}
.btn-ghost-light{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 14px;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;transition:.15s;}
.btn-ghost-light:hover{background:rgba(255,255,255,.12)}
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 60px}
.wrap.wide{max-width:1180px}
.center-screen{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:24px 16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 1px 2px rgba(15,42,67,.04);}
.card + .card{margin-top:16px}
h1{font-size:22px;margin:0 0 6px;font-weight:900}
h2{font-size:18px;margin:0 0 4px;font-weight:700}
h3{font-size:15px;margin:0;font-weight:700}
p.lead{color:var(--sub);font-size:14px;margin:0 0 18px;line-height:1.7}
label.field-label{display:block;font-size:13px;font-weight:700;color:var(--navy-2);margin:0 0 6px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=tel],textarea,select{width:100%;font-family:inherit;font-size:14.5px;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);transition:.15s;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(23,58,94,.1)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy-2);color:#fff;border:none;padding:12px 22px;border-radius:9px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s;}
.btn:hover{background:var(--navy)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.btn.outline{background:transparent;color:var(--navy-2);border:1.5px solid var(--navy-2)}
.btn.outline:hover{background:#eef2f6}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:#8f2e2e}
.btn.gold{background:var(--gold)}
.btn.gold:hover{background:#8a6a1f}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:7px}
.tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px}
.tab{padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap;border:1px solid transparent;}
.tab.active{background:var(--navy-2);color:#fff}
.tab:not(.active):hover{background:#eef2f6}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px}
.tag.pending{background:var(--amber-bg);color:var(--amber)}
.tag.admin{background:#e7ecf5;color:var(--navy-2)}
.tag.super{background:#f3e8d0;color:var(--gold)}
.tag.member{background:#eef2f4;color:var(--steel)}
.tag.rejected{background:var(--red-bg);color:var(--red)}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.issue{background:var(--red-bg);color:var(--red)}
.msg{padding:12px 15px;border-radius:9px;font-size:13.5px;margin-bottom:14px;line-height:1.6}
.msg.error{background:var(--red-bg);color:var(--red);border:1px solid #f0cccc}
.msg.info{background:#e9f0f7;color:var(--navy-2);border:1px solid #cfdce8}
.msg.success{background:var(--green-bg);color:var(--green);border:1px solid #c7e6d5}
.empty{text-align:center;padding:50px 20px;color:var(--sub);}
.empty .big{font-size:38px;margin-bottom:10px}
table.simple{width:100%;border-collapse:collapse;font-size:13.5px}
table.simple th{text-align:right;color:var(--sub);font-weight:700;font-size:12px;padding:8px 10px;border-bottom:2px solid var(--line)}
table.simple td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.simple tr:last-child td{border-bottom:none}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.list-row:last-child{border-bottom:none}
.list-row .main{min-width:0}
.list-row .main .t1{font-weight:700;font-size:14.5px}
.list-row .main .t2{font-size:12.5px;color:var(--sub);margin-top:2px}
.list-row .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.equip-card{border:1.5px solid var(--line);border-radius:11px;padding:14px 16px;cursor:pointer;transition:.15s;background:#fff;}
.equip-card:hover{border-color:var(--navy-2);box-shadow:0 2px 8px rgba(15,42,67,.08)}
.equip-card .code{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--navy-2);font-size:15px;display:flex;align-items:center}
.equip-card .row2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:12.5px;color:var(--sub);align-items:center}
.size-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:#eef2f4;color:var(--steel)}
.size-pill.t30{background:#eef0fb;color:#3c3f9e}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:7px;flex:none}
.status-dot.ok{background:var(--green)}
.status-dot.warning{background:var(--amber)}
.status-dot.critical{background:var(--red)}
@keyframes blinkOrange{0%,100%{box-shadow:0 0 0 0 rgba(200,121,12,.55)}50%{box-shadow:0 0 0 8px rgba(200,121,12,0)}}
@keyframes blinkRed{0%,100%{box-shadow:0 0 0 0 rgba(178,59,59,.6)}50%{box-shadow:0 0 0 9px rgba(178,59,59,0)}}
.equip-card.status-warning{border-color:var(--amber);animation:blinkOrange 1.4s ease-in-out infinite}
.equip-card.status-critical{border-color:var(--red);animation:blinkRed 1.05s ease-in-out infinite}
.maint-btn{margin-top:10px}
.badge-count{background:var(--red);color:#fff;border-radius:20px;font-size:10.5px;font-weight:700;padding:1px 7px;margin-right:2px}
.section-block{margin-bottom:22px}
.section-title{display:flex;align-items:center;gap:10px;font-weight:900;font-size:14.5px;color:var(--navy);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--navy);}
.q-row{border:1px solid var(--line);border-radius:10px;padding:14px 15px;margin-bottom:10px;background:#fbfcfd;}
.q-row .q-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.q-row .q-text{font-size:14px;font-weight:500;line-height:1.55}
.q-row .q-text .en{display:block;font-size:11.5px;color:var(--sub);font-weight:400;margin-top:2px}
.seg{display:flex;gap:6px;flex:none}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--sub);}

.seg button.issue-sel{background:var(--red-bg);border-color:var(--red);color:var(--red)}

.photo-row{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.photo-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--navy-2);background:#eef2f6;border:1px dashed var(--steel);padding:6px 12px;border-radius:20px;cursor:pointer;}
.photo-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.photo-remove{font-size:11px;color:var(--red);cursor:pointer;font-weight:700}
.pledge-box{background:var(--paper);border:1.5px solid var(--line);border-radius:11px;padding:18px 20px;font-size:13.5px;line-height:2;color:var(--ink);margin-bottom:16px;max-height:260px;overflow-y:auto;}
.checkline{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px;line-height:1.6;font-weight:500}
.checkline input{width:19px;height:19px;margin-top:2px;flex:none;accent-color:var(--navy-2)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy-2);animation:spin .8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.stack-tight > * + *{margin-top:10px}
.muted{color:var(--sub);font-size:12.5px}
.divider{height:1px;background:var(--line);margin:18px 0}
a{color:var(--navy-2)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px}
.kpi .n{font-size:24px;font-weight:900;color:var(--navy)}
.kpi .l{font-size:12px;color:var(--sub);margin-top:2px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13.5px}
@media(max-width:560px){.detail-grid{grid-template-columns:1fr}}
.detail-grid .k{color:var(--sub)}
.detail-grid .v{font-weight:700}
.searchbar{position:relative;margin-bottom:14px}
.searchbar input{padding-right:38px}
.searchbar .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:100;max-width:90vw;text-align:center;}
.link-btn{background:none;border:none;color:var(--navy-2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
.tpl-section-box{border:1.5px solid var(--line);border-radius:11px;padding:16px;margin-bottom:16px;background:#fbfcfd}
.tpl-item-box{border:1px dashed var(--steel);border-radius:9px;padding:12px;margin-bottom:10px;background:#fff}
.shift-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

#cameraModalOverlay{position:fixed;inset:0;background:#000;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
#cameraVideoEl{max-width:100%;max-height:74vh;background:#000;border-radius:10px}
.camera-actions{display:flex;gap:16px;margin-top:18px;align-items:center}
#cameraShotBtn{background:#fff;color:#0f2a43;border:none;border-radius:50%;width:66px;height:66px;font-size:26px;cursor:pointer}

.camera-hint{color:#cfd7de;font-size:12.5px;margin-top:10px;text-align:center}
</style>

/* ---------- ذاكرة صور مؤقتة (photoId -> dataUrl) — بديل عن Firebase Storage ---------- */
const photoCache = {};
async function ensurePhotoLoaded(photoId) {
  if (!photoId || photoCache[photoId] !== undefined) return;
  photoCache[photoId] = null; // علامة "جارِ التحميل" لتفادي طلبات مكررة
  try {
    const snap = await getDoc(doc(db, "photos", photoId));
    photoCache[photoId] = snap.exists() ? (snap.data().dataUrl || "") : "";
  } catch (e) {
    photoCache[photoId] = "";
  }
  render();
}
function photoThumbHtml(photoId, opts) {
  opts = opts || {};
  if (!photoId) return "";
  const cached = photoCache[photoId];
  if (cached === undefined) { ensurePhotoLoaded(photoId); return `<span class="muted">⏳ جارِ تحميل الصورة…</span>`; }
  if (cached === null) return `<span class="muted">⏳ جارِ تحميل الصورة…</span>`;
  if (cached === "") return `<span class="muted" style="color:var(--red)">⚠️ تعذر تحميل الصورة</span>`;
  const img = `<img class="photo-thumb" src="${esc(cached)}" loading="lazy">`;
  return opts.linkFull ? `<a href="${esc(cached)}" target="_blank" rel="noopener">${img}</a>` : img;
}

function setState(patch) { Object.assign(S, patch); render(); }
function showToast(msg) {
  S.toast = msg; render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { S.toast = null; render(); }, 2600);
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtDate(ts) {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("ar-SA", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

async function ensureUserDoc(uid, name, email) {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  if (snap.exists()) return snap.data();
  const isSuper = email.toLowerCase() === SUPER_ADMIN_EMAIL.toLowerCase();
  const data = { name: name || email.split("@")[0], email: email.toLowerCase(), role: isSuper ? "super_admin" : "member", status: isSuper ? "approved" : "pending", approvedBy: isSuper ? "system" : null, createdAt: serverTimestamp() };
  await setDoc(ref, data);
  return data;
}
async function handleRegister(name, email, password) {
  S.authError = ""; S.authBusy = true; render();
  try {
    if (!name.trim()) throw { message: "الرجاء إدخال الاسم الكامل" };
    if (password.length < 6) throw { message: "كلمة المرور يجب أن تكون 6 أحرف على الأقل" };
    const cred = await createUserWithEmailAndPassword(auth, email.trim(), password);
    await ensureUserDoc(cred.user.uid, name.trim(), email.trim());

}

  catch (err) { S.authError = friendlyAuthError(err); } finally { S.authBusy = false; render(); }

function teardownSubs() {
  [unsubUsers, unsubPending, unsubSettings, unsubSubs, unsubTemplate19, unsubTemplate30, unsubEquipStatus, unsubLocks, unsubLock].forEach(u => u && u());
  unsubUsers = unsubPending = unsubSettings = unsubSubs = unsubTemplate19 = unsubTemplate30 = unsubEquipStatus = unsubLocks = unsubLock = null;
}
function subscribeCommon() {
  if (!unsubSettings) unsubSettings = onSnapshot(doc(db, "settings", "survey"), snap => { S.surveyActive = snap.exists() ? !!snap.data().active : false; render(); }, () => {});
  if (!unsubTemplate19) unsubTemplate19 = onSnapshot(doc(db, "settings", "surveyTemplate19"), snap => { S.surveyTemplate19 = (snap.exists() && Array.isArray(snap.data().sections)) ? snap.data().sections : null; render(); }, () => {});
  if (!unsubTemplate30) unsubTemplate30 = onSnapshot(doc(db, "settings", "surveyTemplate30"), snap => { S.surveyTemplate30 = (snap.exists() && Array.isArray(snap.data().sections)) ? snap.data().sections : null; render(); }, () => {});
  if (!unsubEquipStatus) unsubEquipStatus = onSnapshot(collection(db, "equipmentStatus"), snap => { const map = {}; snap.docs.forEach(d => map[d.id] = d.data()); S.equipStatus = map; render(); }, () => {});
}
function subscribeUserLock(uid) {
  unsubLock = onSnapshot(doc(db, "locks", uid), snap => {
    if (snap.exists() && snap.data().lockedAt) {
      const lockedAt = snap.data().lockedAt.toDate ? snap.data().lockedAt.toDate() : new Date(snap.data().lockedAt);
      S.lockUntil = new Date(lockedAt.getTime() + LOCK_DURATION_MS);
    } else {
      S.lockUntil = null;
    }
    render();
  }, () => { S.lockUntil = null; render(); });
}
function subscribeAdminData() {
  if (!unsubPending) unsubPending = onSnapshot(query(collection(db, "users"), where("status", "==", "pending")), snap => { S.pendingUsers = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
  if (!unsubUsers) unsubUsers = onSnapshot(collection(db, "users"), snap => { S.allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar")); render(); }, () => {});
  if (!unsubSubs) unsubSubs = onSnapshot(query(collection(db, "submissions"), orderBy("createdAt", "desc"), qlimit(500)), snap => { S.allSubmissions = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
  if (!unsubLocks) unsubLocks = onSnapshot(collection(db, "locks"), snap => { const map = {}; snap.docs.forEach(d => map[d.id] = d.data()); S.allLocks = map; render(); }, () => {});
}

onAuthStateChanged(auth, async (user) => {
  teardownSubs();
  if (!user) { setState({ user: null, profile: null, view: "auth" }); return; }
  S.user = user;
  try { S.profile = await ensureUserDoc(user.uid, user.displayName, user.email); } catch (e) { S.profile = null; }
  subscribeCommon();
  subscribeUserLock(user.uid);
  if (S.profile && (S.profile.role === "admin" || S.profile.role === "super_admin") && S.profile.status === "approved") subscribeAdminData();
  onSnapshot(doc(db, "users", user.uid), snap => {
    if (snap.exists()) {
      S.profile = snap.data();
      if ((S.profile.role === "admin" || S.profile.role === "super_admin") && S.profile.status === "approved") subscribeAdminData();
    }
    routeView(); render();
  });
  routeView(); render();
});

function routeView() {
  if (!S.profile) { S.view = "auth"; return; }
  if (S.profile.status === "rejected") { S.view = "rejected"; return; }
  if (S.profile.status === "pending") { S.view = "pending"; return; }
  if (S.profile.role === "admin" || S.profile.role === "super_admin") { S.view = "admin"; return; }
  S.view = "member";
}

function collectPhotoIds(answers) {
  const ids = [];
  if (!answers) return ids;
  Object.values(answers).forEach(a => { if (a && a.photoId) ids.push(a.photoId); });
  return ids;
}
async function deletePhotosByIds(ids) {
  await Promise.all(ids.map(pid => deleteDoc(doc(db, "photos", pid)).catch(() => {})));
}

/* حذف كل استبيانات مستخدم معيّن (مع صورها) */
async function deleteAllSubmissionsForUser(uid) {
  const snap = await getDocs(query(collection(db, "submissions"), where("uid", "==", uid)));
  if (snap.empty) return 0;
  const batch = writeBatch(db);
  const photoIds = [];
  snap.docs.forEach(d => { batch.delete(d.ref); photoIds.push(...collectPhotoIds(d.data().answers)); });
  await batch.commit();
  await deletePhotosByIds(photoIds);
  return snap.size;
}

function exportEquipmentExcel() {
  const mainRows = EQUIPMENT.map(e => {
    const st = S.equipStatus[e.code] || {};
    const inspected = !!st.level;
    const levelAr = st.level === "critical" ? "حرجة 🔴" : st.level === "warning" ? "تحتاج متابعة 🟠" : st.level === "ok" ? "سليمة 🟢" : "لم يتم الفحص بعد";
    return {
      "كود المعدة": e.code, "رقم اللوحة": e.plate_ar, "الحجم": e.size + " طن", "البلدية": e.zone || "",
      "تم الفحص؟": inspected ? "نعم" : "لا",
      "حالة الفحص": levelAr,
      "عدد الملاحظات في آخر فحص": inspected ? (st.issueCount ?? 0) : "",
      "تم تدقيقه من المسؤول؟": st.reviewed ? "نعم" : (inspected ? "لا" : ""),
      "تاريخ التدقيق": st.reviewedAt && st.reviewedAt.toDate ? st.reviewedAt.toDate().toLocaleString("ar-SA") : "",
      "الفني الذي فحصها": st.lastSubmittedByTech || st.lastSubmittedBy || "",
      "آخر تحديث": st.updatedAt && st.updatedAt.toDate ? st.updatedAt.toDate().toLocaleString("ar-SA") : "",
    };
  });

  const detailRows = [];
  EQUIPMENT.forEach(e => {
    const st = S.equipStatus[e.code];
    if (!st || !st.answers) return;
    const qmap = flattenTemplateQuestions(e.size);
    Object.keys(st.answers).forEach(key => {
      const a = st.answers[key], it = qmap[key];
      if (!it || !a || !a.status) return;
      const isIssue = it.type === "select" ? (it.issueValues || []).includes(a.status) : a.status === "issue";
      detailRows.push({
        "كود المعدة": e.code, "رقم اللوحة": e.plate_ar,
        "السؤال": it.ar,
        "النتيجة": it.type === "select" ? a.status : (isIssue ? "✗ ملاحظة" : "✓ سليم"),
        "الحالة العامة": isIssue ? "يحتاج متابعة" : "سليم",
        "ملاحظة إضافية": a.remark || "",
        "يوجد صورة؟": a.photoId ? "نعم" : "لا",
      });
    });
  });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(mainRows);
  ws1["!cols"] = [{ wch: 12 }, { wch: 16 }, { wch: 8 }, { wch: 14 }, { wch: 10 }, { wch: 18 }, { wch: 14 }, { wch: 16 }, { wch: 18 }, { wch: 18 }, { wch: 20 }];
  XLSX.utils.book_append_sheet(wb, ws1, "حالة الصهاريج");

  const ws2 = XLSX.utils.json_to_sheet(detailRows.length ? detailRows : [{ "ملاحظة": "لا توجد تفاصيل بعد" }]);
  ws2["!cols"] = [{ wch: 12 }, { wch: 16 }, { wch: 40 }, { wch: 16 }, { wch: 14 }, { wch: 30 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws2, "تفصيل الملاحظات");

  XLSX.writeFile(wb, `حالة_الصهاريج_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

/* ---- تخزين الصورة في مستند خاص بها (منفصل) داخل مجموعة photos — لضمان إرسال جميع الصور دائماً ---- */
async function attachPhotoBlob(key, blob) {
  if (!blob) return;
  showToast("جارِ رفع الصورة…");
  try {
    const dataUrl = await compressImageBlob(blob, 700, 0.55);
    const photoRef = await addDoc(collection(db, "photos"), {
      dataUrl, uid: S.user.uid, createdAt: serverTimestamp(),
    });
    photoCache[photoRef.id] = dataUrl;
    S.answers[key] = { ...(S.answers[key] || {}), photoId: photoRef.id };
    showToast("تم إرفاق الصورة");
    render();
  } catch (e) {
    console.error("photo upload error:", e);
    showToast("تعذّر رفع الصورة، تحقق من الاتصال وحاول مجدداً");
  }
}
function compressImageBlob(blob, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image load failed")); };
    img.src = url;
  });
}
function removePhoto(key) {
  const ans = S.answers[key];
  const oldId = ans && ans.photoId;
  S.answers[key] = { ...(ans || {}), photoId: "" };
  render();
  if (oldId) deleteDoc(doc(db, "photos", oldId)).catch(() => {});
}

/* ---- كاميرا مباشرة فقط ---- */
function ensureCameraModal() {
  if (document.getElementById("cameraModalOverlay")) return;
  const div = document.createElement("div");
  div.id = "cameraModalOverlay";
  div.innerHTML = `
    <video id="cameraVideoEl" autoplay playsinline muted></video>
    <div class="camera-actions">
      <button id="cameraShotBtn" type="button">📷</button>
      <button id="cameraCancelBtn" type="button">إلغاء</button>
    </div>
    <p class="camera-hint">تصوير مباشر فقط — لا يمكن اختيار صورة من المعرض</p>
  `;
  document.body.appendChild(div);
  document.getElementById("cameraShotBtn").addEventListener("click", capturePhotoNow);
  document.getElementById("cameraCancelBtn").addEventListener("click", closeCameraModal);
}
async function openCameraModal(key) {
  ensureCameraModal();
  cameraPendingKey = key;
  const overlay = document.getElementById("cameraModalOverlay");
  overlay.style.display = "flex";
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    document.getElementById("cameraVideoEl").srcObject = cameraStream;
  } catch (e) {
    showToast("تعذّر الوصول إلى الكاميرا، تحقق من الأذونات");
    closeCameraModal();
  }
}
function closeCameraModal() {
  const overlay = document.getElementById("cameraModalOverlay");
  if (overlay) overlay.style.display = "none";
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  cameraPendingKey = null;
}
function capturePhotoNow() {
  const videoEl = document.getElementById("cameraVideoEl");
  if (!videoEl || !videoEl.videoWidth) return;
  const canvas = document.createElement("canvas");
  canvas.width = videoEl.videoWidth; canvas.height = videoEl.videoHeight;
  canvas.getContext("2d").drawImage(videoEl, 0, 0);
  const key = cameraPendingKey;
  canvas.toBlob((blob) => { closeCameraModal(); if (blob) attachPhotoBlob(key, blob); }, "image/jpeg", 0.85);
}

/* شدّة الأعطال */
function computeSeverity(template, answers) {
  let issueCount = 0;
  template.forEach(sec => sec.items.forEach(it => {
    const a = answers[it.key]; if (!a) return;
    if (it.type === "select") { if ((it.issueValues || []).includes(a.status)) issueCount++; }
    else if (a.status === "issue") issueCount++;
  }));
  let level = "ok";
  if (issueCount >= ISSUE_CRITICAL_THRESHOLD) level = "critical";
  else if (issueCount >= ISSUE_WARNING_THRESHOLD) level = "warning";
  return { level, issueCount };
}
function isSurveyComplete(template, answers) {
  for (const sec of template) for (const it of sec.items) { const a = answers[it.key]; if (!a || !a.status) return false; }
  return true;
}

async function submitSurvey() {
  if (S.submitBusy) return;
  const eq = S.selectedEquip;
  const template = getSurveyTemplate(eq.size);
  if (!isSurveyComplete(template, S.answers)) { showToast("الرجاء الإجابة على جميع أسئلة الاستبيان قبل الإرسال"); return; }
  setState({ submitBusy: true });
  try {
    const { level, issueCount } = computeSeverity(template, S.answers);
    const subRef = await addDoc(collection(db, "submissions"), {
      uid: S.user.uid, userName: S.profile.name, userEmail: S.profile.email,
      technicianName: S.techName, technicianId: S.techId, shift: S.shift,
      equipmentCode: eq.code, plate: eq.plate_ar, size: eq.size, zone: eq.zone || "",
      answers: S.answers, generalNotes: S.generalNotes || "", pledgeAccepted: true,
      issueLevel: level, issueCount, reviewed: false, createdAt: serverTimestamp(),
    });
    await setDoc(doc(db, "equipmentStatus", eq.code), {
      level, issueCount, plate: eq.plate_ar, zone: eq.zone || "", size: eq.size,
      answers: S.answers,
      lastSubmissionId: subRef.id, lastSubmittedBy: S.profile.name, lastSubmittedByTech: S.techName,
      reviewed: false, reviewedAt: null, reviewedBy: null,
      updatedAt: serverTimestamp(),
    }, { merge: true });
    await setDoc(doc(db, "locks", S.user.uid), {
      lockedAt: serverTimestamp(), technicianName: S.techName, equipmentCode: eq.code,
    });
    setState({ memberFlow: "done", submitBusy: false });
  } catch (e) {
    console.error("submit error:", e);
    setState({ submitBusy: false });
    showToast("تعذّر إرسال الاستبيان، تحقق من الاتصال وحاول مجدداً");
  }
}

/* ============================================================ ربط الأحداث ============================================================ */
function bindEvents() {
  const authForm = document.getElementById("authForm");
  if (authForm) authForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("f_email").value, pass = document.getElementById("f_pass").value;
    if (S.authMode === "login") handleLogin(email, pass); else handleRegister(document.getElementById("f_name").value, email, pass);
  });

  const equipInput = document.getElementById("equipSearchInput");
  if (equipInput) equipInput.addEventListener("input", (e) => {
    S.equipSearch = e.target.value;
    const wrap = document.getElementById("equipResults");
    const q = S.equipSearch.trim();
    let html;
    if (q.length < 1) html = `<p class="muted">ابدأ الكتابة لعرض النتائج…</p>`;
    else {
      const nq = normalizeSearch(q);
      const results = EQUIPMENT.filter(x => normalizeSearch(x.code).includes(nq) || normalizeSearch(x.plate_ar).includes(nq) || normalizeSearch(x.plate_en).includes(nq) || normalizeSearch(x.chassis).includes(nq) || normalizeSearch(x.zone).includes(nq));
      html = results.length === 0 ? `<div class="empty"><div class="big">🔎</div><p>لا توجد نتائج مطابقة</p></div>` : results.map(equipCardHtml).join("");
    }
    wrap.innerHTML = html; bindDynamicClicks(wrap);
  });

  const techNameInput = document.getElementById("techNameInput");
  if (techNameInput) techNameInput.addEventListener("input", (e) => { S.techName = e.target.value; render(); });
  const techIdInput = document.getElementById("techIdInput");
  if (techIdInput) techIdInput.addEventListener("input", (e) => {
    const v = e.target.value.replace(/[^0-9]/g, "").slice(0, 10);
    e.target.value = v;
    S.techId = v;
    render();
  });

  const adminEquipInput = document.getElementById("adminEquipSearchInput");
  if (adminEquipInput) { adminEquipInput.addEventListener("input", (e) => { S.adminEquipSearch = e.target.value; render(); }); adminEquipInput.focus(); adminEquipInput.selectionStart = adminEquipInput.selectionEnd = adminEquipInput.value.length; }

  const pledgeChk = document.getElementById("pledgeChk");
  if (pledgeChk) pledgeChk.addEventListener("change", (e) => { S.pledgeChecked = e.target.checked; render(); });

  const generalNotes = document.getElementById("generalNotes");
  if (generalNotes) generalNotes.addEventListener("input", (e) => { S.generalNotes = e.target.value; });

  document.querySelectorAll("[data-remark]").forEach(el => el.addEventListener("input", (e) => setAnswerRemark(el.dataset.remark, e.target.value)));
  document.querySelectorAll("[data-select]").forEach(el => el.addEventListener("change", (e) => setAnswerSelect(el.dataset.select, e.target.value)));
  document.querySelectorAll("[data-changerole]").forEach(el => el.addEventListener("change", (e) => { const u = S.allUsers.find(x => x.id === el.dataset.changerole); if (u) changeRole(u, e.target.value); }));

  document.querySelectorAll("[data-tplsec]").forEach(el => el.addEventListener("input", (e) => { const si = el.dataset.tplsec; if (S.templateDraft && S.templateDraft[si]) S.templateDraft[si].title = e.target.value; }));
  document.querySelectorAll("[data-tplitem]").forEach(el => {
    const evName = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evName, (e) => {
      const [si, ii, field] = el.dataset.tplitem.split(":");
      if (!S.templateDraft || !S.templateDraft[si] || !S.templateDraft[si].items[ii]) return;
      const it = S.templateDraft[si].items[ii];
      if (field === "options") it.options = e.target.value.split(/[,،]/).map(x => x.trim()).filter(Boolean);
      else if (field === "type") { it.type = e.target.value === "select" ? "select" : undefined; if (it.type === "select" && (!it.options || !it.options.length)) it.options = ["خيار 1", "خيار 2"]; render(); }
      else it[field] = e.target.value;
    });
  });

  bindDynamicClicks(appEl);
}

function bindDynamicClicks(root) {
  root.querySelectorAll("[data-act]").forEach(el => {
    if (el._bound) return; el._bound = true;
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const act = el.dataset.act;
      if (act === "logout") return handleLogout();
      if (act === "switchAuth") return setState({ authMode: S.authMode === "login" ? "register" : "login", authError: "" });
      if (act === "forgotPass") {
        const email = prompt("أدخل بريدك الإلكتروني لإرسال رابط إعادة تعيين كلمة المرور:");
        if (email) sendPasswordResetEmail(auth, email.trim()).then(() => showToast("تم إرسال رابط إعادة التعيين إلى بريدك")).catch(() => showToast("تعذّر إرسال الرابط، تحقق من البريد"));
        return;
      }
      if (act === "acceptPledge") return setState({ memberFlow: "info", techName: S.techName || (S.profile ? S.profile.name : "") });
      if (act === "pickShift") return setState({ shift: el.dataset.shift });
      if (act === "confirmInfo") { if (!(S.techName.trim() && /^[0-9]{10}$/.test(S.techId.trim()) && S.shift)) return; return setState({ memberFlow: "pick" }); }
      if (act === "pickEquip") { const eq = EQUIPMENT_BY_CODE[el.dataset.code]; if (eq) pickEquipment(eq); return; }
      if (act === "changeEquip") return setState({ memberFlow: "pick", selectedEquip: null });
      if (act === "removePhoto") return removePhoto(el.dataset.key);
      if (act === "openCamera") return openCameraModal(el.dataset.key);
      if (act === "submitSurvey") return submitSurvey();
      if (act === "newSurvey") return resetMemberFlow();

      if (act === "adminTab") { const patch = { adminTab: el.dataset.tab, filesSelectedUser: null, filesSelectedSub: null, _openEquip: null }; if (el.dataset.tab !== "template") patch.templateDraft = null; return setState(patch); }
      if (act === "approve") { const u = S.pendingUsers.find(x => x.id === el.dataset.id); if (u) approveUser(u, el.dataset.role); return; }
      if (act === "reject") { const u = S.pendingUsers.find(x => x.id === el.dataset.id); if (u && confirm(`هل أنت متأكد من رفض طلب ${u.name}؟`)) rejectUser(u); return; }
      if (act === "deleteUser") { const u = (S.pendingUsers.find(x => x.id === el.dataset.id)) || (S.allUsers.find(x => x.id === el.dataset.id)); if (u) deleteUserRecord(u); return; }
      if (act === "deleteUserFile") return deleteUserFileAll(el.dataset.id, el.dataset.name);
      if (act === "unlockUser") { const u = S.allUsers.find(x => x.id === el.dataset.id); if (u) adminUnlockUser(u); return; }
      if (act === "openUserFile") return setState({ filesSelectedUser: el.dataset.id, filesSelectedSub: null });
      if (act === "backToFilesList") return setState({ filesSelectedUser: null, filesSelectedSub: null });
      if (act === "backToUserFile") return setState({ filesSelectedSub: null });
      if (act === "viewSub") { const sub = S.allSubmissions.find(s => s.id === el.dataset.id); return setState({ adminTab: "files", filesSelectedUser: sub ? sub.uid : S.filesSelectedUser, filesSelectedSub: el.dataset.id }); }
      if (act === "markReviewed") return markReviewed(el.dataset.id);
      if (act === "deleteSub") return deleteSubmission(el.dataset.id);
      if (act === "viewEquipDetail") { S._openEquip = S._openEquip === el.dataset.code ? null : el.dataset.code; return render(); }
      if (act === "clearMaintenance") return clearMaintenance(el.dataset.code);
      if (act === "exportEquipExcel") return exportEquipmentExcel();
      if (act === "toggleSurvey") return toggleSurvey(el.dataset.val === "on");

      if (act === "tplSwitchSize") return setState({ templateEditSize: Number(el.dataset.size), templateDraft: null });
      if (act === "tplAddItem") { ensureTemplateDraft(); S.templateDraft[el.dataset.si].items.push({ key: "q_" + Date.now(), ar: "سؤال جديد", en: "" }); return render(); }
      if (act === "tplRemoveItem") { ensureTemplateDraft(); S.templateDraft[el.dataset.si].items.splice(el.dataset.ii, 1); return render(); }
      if (act === "tplAddSection") { ensureTemplateDraft(); S.templateDraft.push({ key: "sec_" + Date.now(), title: "قسم جديد", titleEn: "", items: [] }); return render(); }
      if (act === "tplRemoveSection") { if (confirm("هل أنت متأكد من حذف هذا القسم بكل أسئلته؟")) { ensureTemplateDraft(); S.templateDraft.splice(el.dataset.si, 1); } return render(); }
      if (act === "tplSave") return saveTemplate();
    });
  });
  root.querySelectorAll("[data-qstatus]").forEach(el => { if (el._bound2) return; el._bound2 = true; el.addEventListener("click", (e) => { e.stopPropagation(); setAnswerStatus(el.dataset.qstatus, el.dataset.val); }); });
}

render();
</script>
</body>
</html>
