<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تجربتي الأولى</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h1 {
      color: #0d5c63;
      margin-bottom: 20px;
    }
    button {
      background: #0d5c63;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #094247;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="title">مرحباً بك في موقعي التجريبي</h1>
    <p>هذا موقع بسيط جدًا للتجربة</p>
    <br>
    <button onclick="changeText()">اضغط هنا</button>
  </div>

  <script>
    function changeText() {
      document.getElementById("title").innerText = "تم التحديث بنجاح!";
    }
  </script>
</body>
</html>
