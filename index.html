.stack-tight > * + *{margin-top:10px}
.muted{color:var(--sub);font-size:12.5px}
.divider{height:1px;background:var(--line);margin:18px 0}

</style>

async function ensureUserDoc(uid, name, email) {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  if (snap.exists()) return snap.data();
  const isSuper = email.toLowerCase() === SUPER_ADMIN_EMAIL.toLowerCase();
  const data = { name: name || email.split("@")[0], email: email.toLowerCase(), role: isSuper ? "super_admin" : "member", status: isSuper ? "approved" : "pending", approvedBy: isSuper ? "system" : null, createdAt: serverTimestamp() };
  await setDoc(ref, data);
  return data;
}
async function handleRegister(name, email, password) {
  S.authError = ""; S.authBusy = true; render();
  try {
    if (!name.trim()) throw { message: "الرجاء إدخال الاسم الكامل" };
    if (password.length < 6) throw { message: "كلمة المرور يجب أن تكون 6 أحرف على الأقل" };
    const cred = await createUserWithEmailAndPassword(auth, email.trim(), password);
    await ensureUserDoc(cred.user.uid, name.trim(), email.trim());
  } catch (err) { S.authError = friendlyAuthError(err); } finally { S.authBusy = false; render(); }
}
async function handleLogin(email, password) {
  S.authError = ""; S.authBusy = true; render();
  try { await signInWithEmailAndPassword(auth, email.trim(), password); }
  catch (err) { S.authError = friendlyAuthError(err); } finally { S.authBusy = false; render(); }
}
async function handleLogout() {
  await signOut(auth); teardownSubs();
  setState({ profile: null, view: "auth", memberFlow: "info", selectedEquip: null, answers: {}, pledgeChecked: false, techName: "", techId: "", shift: "", myDone: {} });
}
function friendlyAuthError(err) {
  const code = err && err.code || "";
  const map = {
    "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة", "auth/user-not-found": "لا يوجد حساب بهذا البريد",
    "auth/wrong-password": "كلمة المرور غير صحيحة", "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة",
    "auth/email-already-in-use": "هذا البريد مسجّل مسبقاً، جرّب تسجيل الدخول", "auth/weak-password": "كلمة المرور ضعيفة جداً",
    "auth/too-many-requests": "محاولات كثيرة، الرجاء الانتظار قليلاً والمحاولة مجدداً",
  };
  return map[code] || (err && err.message) || "حدث خطأ غير متوقع، حاول مرة أخرى";
}

function teardownSubs() {
  [unsubUsers, unsubPending, unsubSettings, unsubSubs, unsubTemplate19, unsubTemplate30, unsubEquipStatus, unsubDone].forEach(u => u && u());
  unsubUsers = unsubPending = unsubSettings = unsubSubs = unsubTemplate19 = unsubTemplate30 = unsubEquipStatus = unsubDone = null;
}
function subscribeCommon() {
  if (!unsubSettings) unsubSettings = onSnapshot(doc(db, "settings", "survey"), snap => { S.surveyActive = snap.exists() ? !!snap.data().active : false; render(); }, () => {});
  if (!unsubTemplate19) unsubTemplate19 = onSnapshot(doc(db, "settings", "surveyTemplate19"), snap => { S.surveyTemplate19 = (snap.exists() && Array.isArray(snap.data().sections)) ? snap.data().sections : null; render(); }, () => {});
  if (!unsubTemplate30) unsubTemplate30 = onSnapshot(doc(db, "settings", "surveyTemplate30"), snap => { S.surveyTemplate30 = (snap.exists() && Array.isArray(snap.data().sections)) ? snap.data().sections : null; render(); }, () => {});
  if (!unsubEquipStatus) unsubEquipStatus = onSnapshot(collection(db, "equipmentStatus"), snap => { const map = {}; snap.docs.forEach(d => map[d.id] = d.data()); S.equipStatus = map; render(); }, () => {});
  if (!unsubDone) unsubDone = onSnapshot(query(collection(db, "completions"), where("uid", "==", S.user.uid)),
    snap => { const m = {}; snap.docs.forEach(d => m[d.data().code] = true); S.myDone = m; render(); }, () => {});
}
function subscribeAdminData() {
  if (!unsubPending) unsubPending = onSnapshot(query(collection(db, "users"), where("status", "==", "pending")), snap => { S.pendingUsers = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
  if (!unsubUsers) unsubUsers = onSnapshot(collection(db, "users"), snap => { S.allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar")); render(); }, () => {});
  if (!unsubSubs) unsubSubs = onSnapshot(query(collection(db, "submissions"), orderBy("createdAt", "desc"), qlimit(500)), snap => { S.allSubmissions = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
}

onAuthStateChanged(auth, async (user) => {
  teardownSubs();
  if (!user) { setState({ user: null, profile: null, view: "auth" }); return; }
  S.user = user;
  try { S.profile = await ensureUserDoc(user.uid, user.displayName, user.email); } catch (e) { S.profile = null; }
  subscribeCommon();
  if (S.profile && (S.profile.role === "admin" || S.profile.role === "super_admin") && S.profile.status === "approved") subscribeAdminData();
  onSnapshot(doc(db, "users", user.uid), snap => {
    if (snap.exists()) {
      S.profile = snap.data();
      if ((S.profile.role === "admin" || S.profile.role === "super_admin") && S.profile.status === "approved") subscribeAdminData();
    }
    routeView(); render();
  });
  routeView(); render();
});

function routeView() {
  if (!S.profile) { S.view = "auth"; return; }
  if (S.profile.status === "rejected") { S.view = "rejected"; return; }
  if (S.profile.status === "pending") { S.view = "pending"; return; }
  if (S.profile.role === "admin" || S.profile.role === "super_admin") { S.view = "admin"; return; }
  if (!S.techName) S.techName = S.profile.name || "";
  S.view = "member";
}

    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    document.getElementById("cameraVideoEl").srcObject = cameraStream;
  } catch (e) { showToast("تعذّر الوصول إلى الكاميرا، تحقق من الأذونات"); closeCameraModal(); }
}
function closeCameraModal() {
  const overlay = document.getElementById("cameraModalOverlay");
  if (overlay) overlay.style.display = "none";
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  cameraPendingKey = null;
}
function capturePhotoNow() {
  const videoEl = document.getElementById("cameraVideoEl");
  if (!videoEl || !videoEl.videoWidth) return;
  const canvas = document.createElement("canvas");
  canvas.width = videoEl.videoWidth; canvas.height = videoEl.videoHeight;
  canvas.getContext("2d").drawImage(videoEl, 0, 0);
  const key = cameraPendingKey;
  canvas.toBlob((blob) => { closeCameraModal(); if (blob) attachPhotoBlob(key, blob); }, "image/jpeg", 0.85);
}

function computeSeverity(template, answers) {
  let issueCount = 0;
  template.forEach(sec => sec.items.forEach(it => {
    const a = answers[it.key]; if (!a) return;
    if (it.type === "select") { if ((it.issueValues || []).includes(a.status)) issueCount++; }
    else if (a.status === "issue") issueCount++;
  }));
  let level = "ok";
  if (issueCount >= ISSUE_CRITICAL_THRESHOLD) level = "critical";
  else if (issueCount >= ISSUE_WARNING_THRESHOLD) level = "warning";
  return { level, issueCount };
}
function isSurveyComplete(template, answers) {
  for (const sec of template) for (const it of sec.items) { const a = answers[it.key]; if (!a || !a.status) return false; }
  return true;
}
function buildIssuesText(template, answers) {
  const out = [];
  template.forEach(sec => sec.items.forEach(it => {
    const a = answers[it.key]; if (!a) return;
    const bad = it.type === "select" ? (it.issueValues || []).includes(a.status) : a.status === "issue";
    if (bad) out.push(`${it.ar}: ${it.type === "select" ? a.status : (a.remark || "ملاحظة")}`);
  }));
  return out.join(" | ");
}

async function submitSurvey() {
  if (S.submitBusy) return;
  const eq = S.selectedEquip;
  const template = getSurveyTemplate(eq.size);
  if (!isSurveyComplete(template, S.answers)) { showToast("الرجاء الإجابة على جميع الأسئلة"); return; }
  if (!S.pledgeChecked) { showToast("يجب الموافقة على التعهد"); return; }
  setState({ submitBusy: true });
  try {
    const { level, issueCount } = computeSeverity(template, S.answers);
    const subRef = await addDoc(collection(db, "submissions"), {
      uid: S.user.uid, userName: S.profile.name, userEmail: S.profile.email,
      technicianName: S.techName, technicianId: S.techId, shift: S.shift,
      equipmentCode: eq.code, plate: eq.plate_ar, size: eq.size, zone: eq.zone || "",
      answers: S.answers, generalNotes: S.generalNotes || "", pledgeAccepted: true,
      issueLevel: level, issueCount, reviewed: false, createdAt: serverTimestamp(),
    });
    await setDoc(doc(db, "equipmentStatus", eq.code), {
      level, issueCount, plate: eq.plate_ar, zone: eq.zone || "", size: eq.size,
      issues: buildIssuesText(template, S.answers), generalNotes: S.generalNotes || "",
      lastSubmissionId: subRef.id, lastSubmittedBy: S.profile.name, lastSubmittedByTech: S.techName,
      techId: S.techId, shift: S.shift, reviewed: false, reviewedBy: "", updatedAt: serverTimestamp(),
    }, { merge: true });
    await setDoc(doc(db, "completions", `${S.user.uid}_${eq.code}`), { uid: S.user.uid, code: eq.code, submissionId: subRef.id, createdAt: serverTimestamp() });
    setState({ memberFlow: "done", submitBusy: false });
  } catch (e) { console.error(e); setState({ submitBusy: false }); showToast("تعذّر الإرسال: " + (e.code || e.message)); }
}

    <div class="acts"><button class="btn sm" data-act="approve" data-id="${u.id}" data-role="admin">قبول كمسؤول</button><button class="btn outline sm" data-act="approve" data-id="${u.id}" data-role="member">قبول كعضو</button><button class="btn danger sm" data-act="reject" data-id="${u.id}">رفض</button><button class="btn danger sm" data-act="deleteUser" data-id="${u.id}">حذف نهائي 🗑</button></div></div>`).join("")}</div>`;
}
function renderAdminUsers() {
  return `<div class="card"><table class="simple"><thead><tr><th>الاسم</th><th>البريد</th><th>الحالة</th><th>الصلاحية</th><th></th><th></th></tr></thead><tbody>
    ${S.allUsers.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${statusTag(u.status)}</td><td>${roleTag(u.role)}</td>
    <td>${u.role !== "super_admin" && u.email.toLowerCase() !== SUPER_ADMIN_EMAIL.toLowerCase() ? `<select data-changerole="${u.id}" style="width:auto;padding:5px 8px;font-size:12.5px"><option value="member" ${u.role === "member" ? "selected" : ""}>عضو</option><option value="admin" ${u.role === "admin" ? "selected" : ""}>مسؤول</option></select>` : `<span class="muted">—</span>`}</td>
    <td>${u.role !== "super_admin" && u.id !== S.user.uid ? `<button class="btn danger sm" data-act="deleteUser" data-id="${u.id}">حذف 🗑</button>` : `<span class="muted">—</span>`}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function statusTag(s) { if (s === "approved") return `<span class="tag ok">مفعّل</span>`; if (s === "pending") return `<span class="tag pending">بانتظار الموافقة</span>`; return `<span class="tag rejected">مرفوض</span>`; }
function roleTag(r) { if (r === "super_admin") return `<span class="tag super">المسؤول الأعلى</span>`; if (r === "admin") return `<span class="tag admin">مسؤول</span>`; return `<span class="tag member">عضو</span>`; }
function renderAdminFiles() {
  if (S.filesSelectedSub) {
    const sub = S.allSubmissions.find(s => s.id === S.filesSelectedSub);
    return `<div class="card"><button class="link-btn" data-act="backToUserFile">← رجوع لملف ${esc(sub ? (sub.technicianName || sub.userName) : "")}</button><div class="divider"></div>${sub ? submissionDetailHtml(sub) : `<p class="muted">تعذّر إيجاد هذا الاستبيان</p>`}</div>`;
  }
  if (S.filesSelectedUser) {
    const u = S.allUsers.find(x => x.id === S.filesSelectedUser);
    const subs = S.allSubmissions.filter(s => s.uid === S.filesSelectedUser);
    return `<div class="card"><button class="link-btn" data-act="backToFilesList">← رجوع لكل الملفات</button>
      <h2 style="margin-top:10px">ملف: ${esc(u ? u.name : "")}</h2><p class="muted">${subs.length} استبيان محفوظ</p><div class="divider"></div>
      ${subs.length === 0 ? `<p class="muted">لا يوجد استبيانات بعد</p>` : subs.map(s => `<div class="list-row"><div class="main"><div class="t1">${esc(s.equipmentCode)} — ${esc(s.plate || "")} ${!s.reviewed ? `<span class="tag pending">لم تتم المراجعة</span>` : ""}</div><div class="t2">الفني: ${esc(s.technicianName || "—")} · ${fmtDate(s.createdAt)} · ${s.size} طن</div></div>
      <div class="acts"><button class="btn outline sm" data-act="viewSub" data-id="${s.id}">عرض التفاصيل</button><button class="btn danger sm" data-act="deleteSub" data-id="${s.id}">حذف 🗑</button></div></div>`).join("")}
    </div>`;
  }
  const usersWithCounts = S.allUsers.filter(u => u.status === "approved").map(u => ({ ...u, count: S.allSubmissions.filter(s => s.uid === u.id).length }));
  return `<div class="card"><p class="lead" style="margin-bottom:14px">ملفات الموظفين — كل استبيان محفوظ دائماً في ملف الحساب الذي سجّله، وهذه الصفحة مخصصة للمسؤولين فقط.</p>
    ${usersWithCounts.map(u => `<div class="list-row"><div class="main"><div class="t1">📁 ${esc(u.name)}</div><div class="t2">${esc(u.email)} · ${u.count} استبيان</div></div><div class="acts"><button class="btn outline sm" data-act="openUserFile" data-id="${u.id}">فتح الملف</button><button class="btn danger sm" data-act="deleteUserFile" data-id="${u.id}">حذف الملف 🗑</button></div></div>`).join("")}
  </div>`;
}
function submissionDetailHtml(sub) {
  const eq = EQUIPMENT_BY_CODE[sub.equipmentCode] || {};
  const sections = getSurveyTemplate(sub.size);
  return `<h2>استبيان ${esc(sub.equipmentCode)} ${sub.issueLevel ? `<span class="tag ${sub.issueLevel === "critical" ? "issue" : sub.issueLevel === "warning" ? "pending" : "ok"}">${sub.issueLevel === "critical" ? "حرجة" : sub.issueLevel === "warning" ? "تحتاج متابعة" : "سليمة"}</span>` : ""}</h2>
  <p class="muted">الفني: ${esc(sub.technicianName || "—")} (هوية: ${esc(sub.technicianId || "—")}) · شفت ${esc(sub.shift || "—")} · حساب: ${esc(sub.userName)} · ${fmtDate(sub.createdAt)} · ${sub.size} طن ${eq.zone ? "· " + esc(eq.zone) : ""}
  ${sub.reviewed ? ` · تمت المراجعة بواسطة ${esc(sub.reviewedBy || "")}` : ` · <b style="color:var(--amber)">لم تتم المراجعة بعد</b>`}</p>
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    ${!sub.reviewed ? `<button class="btn sm" data-act="markReviewed" data-id="${sub.id}">تمت المراجعة ✔️</button>` : ""}
    <button class="btn outline sm" data-act="reopenTech" data-id="${sub.id}">إعادة فتح للفني ↺</button>
    <button class="btn danger sm" data-act="deleteSub" data-id="${sub.id}">حذف هذا الاستبيان 🗑</button>
  </div>
  <div class="divider"></div>
  ${sections.map(sec => `<div class="section-block"><div class="section-title">${esc(sec.title)}</div>${sec.items.map(it => {
    const a = (sub.answers || {})[it.key] || {}; const isIssue = a.status === "issue";
    return `<div class="q-row"><div class="q-top"><div class="q-text">${esc(it.ar)}</div>${it.type === "select" ? `<span class="tag ${(it.issueValues || []).includes(a.status) ? "issue" : "ok"}">${esc(a.status || "—")}</span>` : `<span class="tag ${isIssue ? "issue" : "ok"}">${isIssue ? "✗ ملاحظة" : "✓ سليم"}</span>`}</div>
    ${a.remark ? `<div class="muted">${esc(a.remark)}</div>` : ""}
    ${a.photoUrl ? `<div class="photo-row"><a href="${esc(a.photoUrl)}" target="_blank"><img class="photo-thumb" src="${esc(a.photoUrl)}"></a></div>` : ""}</div>`;
  }).join("")}</div>`).join("")}
  ${sub.generalNotes ? `<div class="msg info" style="white-space:pre-line">${esc(sub.generalNotes)}</div>` : ""}`;
}
function renderAdminEquipment() {
  const q = S.adminEquipSearch.trim();
  const nq = normalizeSearch(q);
  const results = q ? EQUIPMENT.filter(e => normalizeSearch(e.code).includes(nq) || normalizeSearch(e.plate_ar).includes(nq) || normalizeSearch(e.chassis).includes(nq) || normalizeSearch(e.zone).includes(nq)) : EQUIPMENT;
  const warnCount = Object.values(S.equipStatus).filter(s => s.level === "warning").length;
  const critCount = Object.values(S.equipStatus).filter(s => s.level === "critical").length;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px"><h2 style="margin:0">دليل المعدات (${EQUIPMENT.length} معدة كاملة)</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn outline sm" data-act="reopenAll">🔓 فتح كل المعدات للجميع</button><button class="btn gold sm" data-act="exportEquipExcel">⬇️ تصدير حالة الصهاريج (Excel)</button></div></div>
    <div class="kpi-grid"><div class="kpi"><div class="n">${EQUIPMENT.length}</div><div class="l">إجمالي المعدات</div></div><div class="kpi"><div class="n">${EQUIPMENT.filter(e => e.size === 19).length}</div><div class="l">19 طن</div></div><div class="kpi"><div class="n">${EQUIPMENT.filter(e => e.size === 30).length}</div><div class="l">30 طن</div></div><div class="kpi"><div class="n" style="color:var(--amber)">${warnCount}</div><div class="l">🟠 تحتاج متابعة</div></div><div class="kpi"><div class="n" style="color:var(--red)">${critCount}</div><div class="l">🔴 حالة حرجة</div></div></div>
    <div class="searchbar"><input type="text" id="adminEquipSearchInput" placeholder="ابحث بالكود أو اللوحة أو البلدية… (اتركه فارغاً لعرض الكل)" value="${esc(S.adminEquipSearch)}"><span class="ic">🔍</span></div>
    <div id="adminEquipResults">${results.map(e => `<div class="equip-card ${equipStatusClass(e.code)}" data-act="viewEquipDetail" data-code="${esc(e.code)}" style="margin-bottom:8px">${equipDetailToggleHtml(e)}</div>`).join("")}</div>
  </div>`;
}
function equipDetailToggleHtml(e) {
  const open = S._openEquip === e.code;
  const st = S.equipStatus[e.code]; const hasIssue = st && st.level && st.level !== "ok";
  return `<div style="display:flex;justify-content:space-between;align-items:center"><span class="code">${equipStatusDot(e.code)}${esc(e.code)}</span><span class="size-pill ${e.size === 30 ? "t30" : ""}">${e.size} طن</span></div>
  <div class="row2"><span>🚛 ${esc(e.plate_ar)}</span><span>📍 ${esc(e.zone || "—")}</span>${hasIssue ? `<span class="tag issue">${st.level === "critical" ? "حرجة" : "تحتاج متابعة"} (${st.issueCount} ملاحظة)</span>` : (st ? `<span class="tag ok">سليمة</span>` : `<span class="muted">لم يتم فحصها بعد</span>`)}</div>
  ${hasIssue ? `<button class="btn outline sm maint-btn" data-act="clearMaintenance" data-code="${esc(e.code)}">✔️ تمت الصيانة — إزالة التنبيه</button>` : ""}
  ${open ? `<div class="divider"></div>${equipDetailHtml(e)}` : ""}`;
}
function renderAdminTemplate() {
  ensureTemplateDraft();
  return `<div class="card">
    <h2>تعديل أسئلة الاستبيان</h2>
    <p class="lead">لكل حجم من المعدات (19 طن / 30 طن) استبيان مستقل. اختر الحجم أولاً ثم عدّل الأسئلة واحفظ.</p>
    <div class="tabs">
      <div class="tab ${S.templateEditSize === 19 ? "active" : ""}" data-act="tplSwitchSize" data-size="19">استبيان 19 طن</div>
      <div class="tab ${S.templateEditSize === 30 ? "active" : ""}" data-act="tplSwitchSize" data-size="30">استبيان 30 طن</div>
    </div>
    ${S.templateDraft.map((sec, si) => `<div class="tpl-section-box">
      <div class="field" style="margin-bottom:10px"><label class="field-label">عنوان القسم</label><input type="text" data-tplsec="${si}" value="${esc(sec.title)}"></div>
      ${sec.items.map((it, ii) => `<div class="tpl-item-box">
        <div class="grid2"><div class="field"><label class="field-label">نص السؤال (عربي)</label><input type="text" data-tplitem="${si}:${ii}:ar" value="${esc(it.ar)}"></div>
        <div class="field"><label class="field-label">Question (English) — اختياري</label><input type="text" data-tplitem="${si}:${ii}:en" value="${esc(it.en || "")}"></div></div>
        <div class="grid2"><div class="field"><label class="field-label">نوع الإجابة</label><select data-tplitem="${si}:${ii}:type"><option value="okissue" ${it.type !== "select" ? "selected" : ""}>سليم / ملاحظة</option><option value="select" ${it.type === "select" ? "selected" : ""}>قائمة اختيار</option></select></div>
        ${it.type === "select" ? `<div class="field"><label class="field-label">خيارات القائمة (مفصولة بفاصلة)</label><input type="text" data-tplitem="${si}:${ii}:options" value="${esc((it.options || []).join('، '))}"></div>` : `<div></div>`}</div>
        <button class="btn danger sm" data-act="tplRemoveItem" data-si="${si}" data-ii="${ii}">حذف السؤال 🗑</button>
      </div>`).join("")}
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><button class="btn outline sm" data-act="tplAddItem" data-si="${si}">+ إضافة سؤال</button><button class="btn danger sm" data-act="tplRemoveSection" data-si="${si}">حذف القسم بالكامل 🗑</button></div>
    </div>`).join("")}
    <button class="btn outline block" data-act="tplAddSection">+ إضافة قسم جديد</button>
    <div class="divider"></div>
    <button class="btn block gold" data-act="tplSave">💾 حفظ تعديلات استبيان ${S.templateEditSize} طن ونشرها للأعضاء</button>
  </div>`;
}
function renderAdminSurvey() {
  return `<div class="card"><h2>حالة الاستبيان</h2><p class="lead">عند التفعيل، يستطيع الأعضاء الدخول وتعبئة استبيان الفحص. عند الإيقاف تظهر لهم رسالة "لا يوجد استبيان".</p>
    <div class="msg ${S.surveyActive ? "success" : "info"}">الحالة الحالية: ${S.surveyActive ? "مفعّل ✅" : "غير مفعّل ⏸️"}</div>
    <button class="btn ${S.surveyActive ? "danger" : ""}" data-act="toggleSurvey" data-val="${S.surveyActive ? "off" : "on"}">${S.surveyActive ? "إيقاف الاستبيان" : "تفعيل الاستبيان"}</button>
  </div>`;
}

/* ============================================================ ربط الأحداث ============================================================ */
function bindEvents() {
  const authForm = document.getElementById("authForm");
  if (authForm) authForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("f_email").value, pass = document.getElementById("f_pass").value;
    if (S.authMode === "login") handleLogin(email, pass); else handleRegister(document.getElementById("f_name").value, email, pass);
  });

  const equipInput = document.getElementById("equipSearchInput");
  if (equipInput) equipInput.addEventListener("input", (e) => {
    S.equipSearch = e.target.value;
    const wrap = document.getElementById("equipResults");
    const q = S.equipSearch.trim();
    let html;
    if (q.length < 1) html = `<p class="muted">ابدأ الكتابة لعرض النتائج…</p>`;
    else {
      const results = searchEquipMember(q);
      html = results.length === 0 ? `<div class="empty"><div class="big">🔎</div><p>لا توجد نتائج (أو تم إنجاز الفحص لها)</p></div>` : results.map(equipCardHtml).join("");
    }
    wrap.innerHTML = html; bindDynamicClicks(wrap);
  });

  const techNameInput = document.getElementById("techNameInput");
  if (techNameInput) techNameInput.addEventListener("input", (e) => { S.techName = e.target.value; updateInfoBtn(); });
  const techIdInput = document.getElementById("techIdInput");
  if (techIdInput) techIdInput.addEventListener("input", (e) => {
    const v = toEnDigits(e.target.value).replace(/\D/g, "").slice(0, 11);
    e.target.value = v; S.techId = v; updateInfoBtn();
  });

  const adminEquipInput = document.getElementById("adminEquipSearchInput");
  if (adminEquipInput) { adminEquipInput.addEventListener("input", (e) => { S.adminEquipSearch = e.target.value; render(); }); adminEquipInput.focus(); adminEquipInput.selectionStart = adminEquipInput.selectionEnd = adminEquipInput.value.length; }

  const pledgeChk = document.getElementById("pledgeChk");
  if (pledgeChk) pledgeChk.addEventListener("change", (e) => { S.pledgeChecked = e.target.checked; render(); });

  const generalNotes = document.getElementById("generalNotes");
  if (generalNotes) generalNotes.addEventListener("input", (e) => { S.generalNotes = e.target.value; });

  document.querySelectorAll("[data-remark]").forEach(el => el.addEventListener("input", (e) => setAnswerRemark(el.dataset.remark, e.target.value)));
  document.querySelectorAll("[data-select]").forEach(el => el.addEventListener("change", (e) => setAnswerSelect(el.dataset.select, e.target.value)));
  document.querySelectorAll("[data-changerole]").forEach(el => el.addEventListener("change", (e) => { const u = S.allUsers.find(x => x.id === el.dataset.changerole); if (u) changeRole(u, e.target.value); }));

  document.querySelectorAll("[data-tplsec]").forEach(el => el.addEventListener("input", (e) => { const si = el.dataset.tplsec; if (S.templateDraft && S.templateDraft[si]) S.templateDraft[si].title = e.target.value; }));
  document.querySelectorAll("[data-tplitem]").forEach(el => {
    const evName = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evName, (e) => {
      const [si, ii, field] = el.dataset.tplitem.split(":");
      if (!S.templateDraft || !S.templateDraft[si] || !S.templateDraft[si].items[ii]) return;
      const it = S.templateDraft[si].items[ii];
      if (field === "options") it.options = e.target.value.split(/[,،]/).map(x => x.trim()).filter(Boolean);
      else if (field === "type") { it.type = e.target.value === "select" ? "select" : undefined; if (it.type === "select" && (!it.options || !it.options.length)) it.options = ["خيار 1", "خيار 2"]; render(); }
      else it[field] = e.target.value;
    });
  });

  bindDynamicClicks(appEl);
}

function bindDynamicClicks(root) {
  root.querySelectorAll("[data-act]").forEach(el => {
    if (el._bound) return; el._bound = true;
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const act = el.dataset.act;
      if (act === "logout") return handleLogout();
      if (act === "switchAuth") return setState({ authMode: S.authMode === "login" ? "register" : "login", authError: "" });
      if (act === "forgotPass") {
        const email = prompt("أدخل بريدك الإلكتروني لإرسال رابط إعادة تعيين كلمة المرور:");
        if (email) sendPasswordResetEmail(auth, email.trim()).then(() => showToast("تم إرسال رابط إعادة التعيين إلى بريدك")).catch(() => showToast("تعذّر إرسال الرابط، تحقق من البريد"));
        return;
      }
      if (act === "pickShift") return setState({ shift: el.dataset.shift });
      if (act === "confirmInfo") { if (!infoComplete()) return; return setState({ memberFlow: "pick" }); }
      if (act === "pickEquip") { const eq = EQUIPMENT_BY_CODE[el.dataset.code]; if (eq) pickEquipment(eq); return; }
      if (act === "changeEquip") return setState({ memberFlow: "pick", selectedEquip: null });
      if (act === "toPledge") { if (isSurveyComplete(getSurveyTemplate(S.selectedEquip.size), S.answers)) setState({ memberFlow: "pledge" }); return; }
      if (act === "backToSurvey") return setState({ memberFlow: "survey" });
      if (act === "removePhoto") return removePhoto(el.dataset.key);
      if (act === "openCamera") return openCameraModal(el.dataset.key);
      if (act === "submitSurvey") return submitSurvey();
      if (act === "newSurvey") return resetMemberFlow();

      if (act === "adminTab") { const patch = { adminTab: el.dataset.tab, filesSelectedUser: null, filesSelectedSub: null, _openEquip: null }; if (el.dataset.tab !== "template") patch.templateDraft = null; return setState(patch); }
      if (act === "approve") { const u = S.pendingUsers.find(x => x.id === el.dataset.id); if (u) approveUser(u, el.dataset.role); return; }
      if (act === "reject") { const u = S.pendingUsers.find(x => x.id === el.dataset.id); if (u && confirm(`هل أنت متأكد من رفض طلب ${u.name}؟`)) rejectUser(u); return; }
      if (act === "deleteUser") { const u = (S.pendingUsers.find(x => x.id === el.dataset.id)) || (S.allUsers.find(x => x.id === el.dataset.id)); if (u) deleteUserRecord(u); return; }
      if (act === "deleteUserFile") return deleteUserFile(S.allUsers.find(x => x.id === el.dataset.id));
      if (act === "openUserFile") return setState({ filesSelectedUser: el.dataset.id, filesSelectedSub: null });
      if (act === "backToFilesList") return setState({ filesSelectedUser: null, filesSelectedSub: null });
      if (act === "backToUserFile") return setState({ filesSelectedSub: null });
      if (act === "viewSub") { const sub = S.allSubmissions.find(s => s.id === el.dataset.id); return setState({ adminTab: "files", filesSelectedUser: sub ? sub.uid : S.filesSelectedUser, filesSelectedSub: el.dataset.id }); }
      if (act === "markReviewed") return markReviewed(el.dataset.id);
      if (act === "deleteSub") return deleteSubmission(el.dataset.id);
      if (act === "reopenTech") return reopenForTech(el.dataset.id);
      if (act === "reopenAll") return reopenAll();
      if (act === "viewEquipDetail") { S._openEquip = S._openEquip === el.dataset.code ? null : el.dataset.code; return render(); }
      if (act === "clearMaintenance") return clearMaintenance(el.dataset.code);
      if (act === "exportEquipExcel") return exportEquipmentExcel();
      if (act === "toggleSurvey") return toggleSurvey(el.dataset.val === "on");

      if (act === "tplSwitchSize") return setState({ templateEditSize: Number(el.dataset.size), templateDraft: null });
      if (act === "tplAddItem") { ensureTemplateDraft(); S.templateDraft[el.dataset.si].items.push({ key: "q_" + Date.now(), ar: "سؤال جديد", en: "" }); return render(); }
      if (act === "tplRemoveItem") { ensureTemplateDraft(); S.templateDraft[el.dataset.si].items.splice(el.dataset.ii, 1); return render(); }
      if (act === "tplAddSection") { ensureTemplateDraft(); S.templateDraft.push({ key: "sec_" + Date.now(), title: "قسم جديد", titleEn: "", items: [] }); return render(); }
      if (act === "tplRemoveSection") { if (confirm("هل أنت متأكد من حذف هذا القسم بكل أسئلته؟")) { ensureTemplateDraft(); S.templateDraft.splice(el.dataset.si, 1); } return render(); }
      if (act === "tplSave") return saveTemplate();
    });
  });
  root.querySelectorAll("[data-qstatus]").forEach(el => { if (el._bound2) return; el._bound2 = true; el.addEventListener("click", (e) => { e.stopPropagation(); setAnswerStatus(el.dataset.qstatus, el.dataset.val); }); });
}

render();
</script>
</body>
</html>
