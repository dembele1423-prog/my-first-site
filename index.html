<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام فحص الصهاريج اليومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a43;
  --navy-2:#173a5e;
  --steel:#3d5a76;
  --paper:#f4f6f8;
  --card:#ffffff;
  --line:#dfe6ec;
  --ink:#14202b;
  --sub:#5b6b78;
  --amber:#c8790c;
  --amber-bg:#fdf1de;
  --green:#1f7a4d;
  --green-bg:#e7f5ee;
  --red:#b23b3b;
  --red-bg:#fbeaea;
  --gold:#b98a2e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  font-family:'Tajawal',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    linear-gradient(var(--navy),var(--navy) 4px, transparent 4px);
  background-size:100% 4px;
  opacity:0; /* decorative texture disabled by default */
  pointer-events:none;
}
.topbar{
  background:var(--navy);
  color:#fff;
  padding:14px 20px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:30;
  box-shadow:0 2px 10px rgba(15,42,67,.18);
}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold),#8a6a1f);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--navy);font-size:16px;
  flex:none;
}
.brand .name{font-weight:700;font-size:16px;line-height:1.2}
.brand .name small{display:block;font-weight:400;font-size:11px;color:#c9d6e2}
.topbar .who{display:flex;align-items:center;gap:10px;font-size:13px}
.topbar .who .role-tag{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  padding:3px 10px;border-radius:20px;font-size:11px;
}
.btn-ghost-light{
  background:transparent;border:1px solid rgba(255,255,255,.35);
  color:#fff;padding:7px 14px;border-radius:8px;font-family:inherit;
  font-size:13px;cursor:pointer;transition:.15s;
}
.btn-ghost-light:hover{background:rgba(255,255,255,.12)}

.wrap{max-width:880px;margin:0 auto;padding:22px 16px 60px}
.wrap.wide{max-width:1180px}

.center-screen{
  min-height:calc(100vh - 62px);
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:26px;
  box-shadow:0 1px 2px rgba(15,42,67,.04);
}
.card + .card{margin-top:16px}

h1{font-size:22px;margin:0 0 6px;font-weight:900}
h2{font-size:18px;margin:0 0 4px;font-weight:700}
h3{font-size:15px;margin:0;font-weight:700}
p.lead{color:var(--sub);font-size:14px;margin:0 0 18px;line-height:1.7}

label.field-label{display:block;font-size:13px;font-weight:700;color:var(--navy-2);margin:0 0 6px}
input[type=text],input[type=email],input[type=password],input[type=search],textarea,select{
  width:100%;font-family:inherit;font-size:14.5px;
  padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;
  background:#fff;color:var(--ink);transition:.15s;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(23,58,94,.1)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--navy-2);color:#fff;border:none;
  padding:12px 22px;border-radius:9px;font-family:inherit;
  font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s;
}
.btn:hover{background:var(--navy)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.btn.outline{background:transparent;color:var(--navy-2);border:1.5px solid var(--navy-2)}
.btn.outline:hover{background:#eef2f6}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:#8f2e2e}
.btn.gold{background:var(--gold)}
.btn.gold:hover{background:#8a6a1f}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:7px}

.tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px}
.tab{
  padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:700;
  color:var(--sub);cursor:pointer;white-space:nowrap;border:1px solid transparent;
}
.tab.active{background:var(--navy-2);color:#fff}
.tab:not(.active):hover{background:#eef2f6}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px}
.tag.pending{background:var(--amber-bg);color:var(--amber)}
.tag.admin{background:#e7ecf5;color:var(--navy-2)}
.tag.super{background:#f3e8d0;color:var(--gold)}
.tag.member{background:#eef2f4;color:var(--steel)}
.tag.rejected{background:var(--red-bg);color:var(--red)}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.issue{background:var(--red-bg);color:var(--red)}

.msg{padding:12px 15px;border-radius:9px;font-size:13.5px;margin-bottom:14px;line-height:1.6}
.msg.error{background:var(--red-bg);color:var(--red);border:1px solid #f0cccc}
.msg.info{background:#e9f0f7;color:var(--navy-2);border:1px solid #cfdce8}
.msg.success{background:var(--green-bg);color:var(--green);border:1px solid #c7e6d5}

.empty{
  text-align:center;padding:50px 20px;color:var(--sub);
}
.empty .big{font-size:38px;margin-bottom:10px}

table.simple{width:100%;border-collapse:collapse;font-size:13.5px}
table.simple th{text-align:right;color:var(--sub);font-weight:700;font-size:12px;padding:8px 10px;border-bottom:2px solid var(--line)}
table.simple td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.simple tr:last-child td{border-bottom:none}
.list-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 4px;border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:none}
.list-row .main{min-width:0}
.list-row .main .t1{font-weight:700;font-size:14.5px}
.list-row .main .t2{font-size:12.5px;color:var(--sub);margin-top:2px}
.list-row .acts{display:flex;gap:6px;flex:none}

.equip-card{
  border:1.5px solid var(--line);border-radius:11px;padding:14px 16px;
  cursor:pointer;transition:.15s;background:#fff;
}
.equip-card:hover{border-color:var(--navy-2);box-shadow:0 2px 8px rgba(15,42,67,.08)}
.equip-card .code{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--navy-2);font-size:15px}
.equip-card .row2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:12.5px;color:var(--sub)}
.size-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:#eef2f4;color:var(--steel)}
.size-pill.t30{background:#eef0fb;color:#3c3f9e}

.section-block{margin-bottom:22px}
.section-title{
  display:flex;align-items:center;gap:10px;
  font-weight:900;font-size:14.5px;color:var(--navy);
  margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--navy);
}
.q-row{
  border:1px solid var(--line);border-radius:10px;padding:14px 15px;margin-bottom:10px;background:#fbfcfd;
}
.q-row .q-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.q-row .q-text{font-size:14px;font-weight:500;line-height:1.55}
.q-row .q-text .en{display:block;font-size:11.5px;color:var(--sub);font-weight:400;margin-top:2px}
.seg{display:flex;gap:6px;flex:none}
.seg button{
  border:1.5px solid var(--line);background:#fff;border-radius:8px;
  padding:7px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--sub);
}
.seg button.ok-sel{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.seg button.issue-sel{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.q-extra{margin-top:8px}
.photo-row{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.photo-btn{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  color:var(--navy-2);background:#eef2f6;border:1px dashed var(--steel);
  padding:6px 12px;border-radius:20px;cursor:pointer;
}
.photo-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.photo-remove{font-size:11px;color:var(--red);cursor:pointer;font-weight:700}

.pledge-box{
  background:var(--paper);border:1.5px solid var(--line);border-radius:11px;
  padding:18px 20px;font-size:13.5px;line-height:2;color:var(--ink);margin-bottom:16px;
  max-height:260px;overflow-y:auto;
}
.checkline{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px;line-height:1.6;font-weight:500}
.checkline input{width:19px;height:19px;margin-top:2px;flex:none;accent-color:var(--navy-2)}

.spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--navy-2);
  animation:spin .8s linear infinite;margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

.stack-tight > * + *{margin-top:10px}
.muted{color:var(--sub);font-size:12.5px}
.divider{height:1px;background:var(--line);margin:18px 0}
.footer-note{text-align:center;font-size:11.5px;color:var(--sub);margin-top:26px}
a{color:var(--navy-2)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px}
.kpi .n{font-size:24px;font-weight:900;color:var(--navy)}
.kpi .l{font-size:12px;color:var(--sub);margin-top:2px}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:13.5px}
@media(max-width:560px){.detail-grid{grid-template-columns:1fr}}
.detail-grid .k{color:var(--sub)}
.detail-grid .v{font-weight:700}

.searchbar{position:relative;margin-bottom:14px}
.searchbar input{padding-right:38px}
.searchbar .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;
  font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:100;
  max-width:90vw;text-align:center;
}
.link-btn{background:none;border:none;color:var(--navy-2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
</style>
</head>

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(ts) {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("ar-SA", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

   6) المصادقة (تسجيل / دخول / خروج)
   ============================================================ */

async function ensureUserDoc(uid, name, email) {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  if (snap.exists()) return snap.data();
  const isSuper = email.toLowerCase() === SUPER_ADMIN_EMAIL.toLowerCase();
  const data = {
    name: name || email.split("@")[0],
    email: email.toLowerCase(),
    role: isSuper ? "super_admin" : "member",
    status: isSuper ? "approved" : "pending",
    approvedBy: isSuper ? "system" : null,
    createdAt: serverTimestamp(),
  };
  await setDoc(ref, data);
  return data;
}

async function handleRegister(name, email, password) {
  S.authError = ""; S.authBusy = true; render();
  try {
    if (!name.trim()) throw { message: "الرجاء إدخال الاسم الكامل" };
    if (password.length < 6) throw { message: "كلمة المرور يجب أن تكون 6 أحرف على الأقل" };
    const cred = await createUserWithEmailAndPassword(auth, email.trim(), password);
    await ensureUserDoc(cred.user.uid, name.trim(), email.trim());
  } catch (err) {
    S.authError = friendlyAuthError(err);
  } finally {
    S.authBusy = false; render();
  }
}

async function handleLogin(email, password) {
  S.authError = ""; S.authBusy = true; render();
  try {
    await signInWithEmailAndPassword(auth, email.trim(), password);
  } catch (err) {
    S.authError = friendlyAuthError(err);
  } finally {
    S.authBusy = false; render();
  }
}

async function handleLogout() {
  await signOut(auth);
  teardownSubs();
  setState({ profile: null, view: "auth", memberFlow: "pledge", selectedEquip: null, answers: {}, pledgeChecked: false });
}

function friendlyAuthError(err) {
  const code = err && err.code || "";
  const map = {
    "auth/invalid-email": "صيغة البريد الإلكتروني غير صحيحة",
    "auth/user-not-found": "لا يوجد حساب بهذا البريد",
    "auth/wrong-password": "كلمة المرور غير صحيحة",
    "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة",
    "auth/email-already-in-use": "هذا البريد مسجّل مسبقاً، جرّب تسجيل الدخول",
    "auth/weak-password": "كلمة المرور ضعيفة جداً",
    "auth/too-many-requests": "محاولات كثيرة، الرجاء الانتظار قليلاً والمحاولة مجدداً",
  };
  return map[code] || (err && err.message) || "حدث خطأ غير متوقع، حاول مرة أخرى";
}

function teardownSubs() {
  [unsubUsers, unsubPending, unsubSettings, unsubSubs].forEach(u => u && u());
  unsubUsers = unsubPending = unsubSettings = unsubSubs = null;
}

function subscribeCommon() {
  if (unsubSettings) return;
  unsubSettings = onSnapshot(doc(db, "settings", "survey"), snap => {
    S.surveyActive = snap.exists() ? !!snap.data().active : false;
    render();
  }, () => {});
}

function subscribeAdminData() {
  if (!unsubPending) {
    unsubPending = onSnapshot(query(collection(db, "users"), where("status", "==", "pending")), snap => {
      S.pendingUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, () => {});
  }
  if (!unsubUsers) {
    unsubUsers = onSnapshot(collection(db, "users"), snap => {
      S.allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.name || "").localeCompare(b.name || "", "ar"));
      render();
    }, () => {});
  }
  if (!unsubSubs) {
    unsubSubs = onSnapshot(query(collection(db, "submissions"), orderBy("createdAt", "desc"), qlimit(500)), snap => {
      S.allSubmissions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, () => {});
  }
}

onAuthStateChanged(auth, async (user) => {
  teardownSubs();
  if (!user) {
    setState({ user: null, profile: null, view: "auth" });
    return;
  }
  S.user = user;
  try {
    const data = await ensureUserDoc(user.uid, user.displayName, user.email);
    S.profile = data;
  } catch (e) {
    S.profile = null;
  }
  subscribeCommon();
  if (S.profile && (S.profile.role === "admin" || S.profile.role === "super_admin") && S.profile.status === "approved") {
    subscribeAdminData();
  }
  // إعادة قراءة الحيّة لبروفايل المستخدم نفسه (لتحديث حالة الموافقة لحظياً)
  onSnapshot(doc(db, "users", user.uid), snap => {
    if (snap.exists()) {
      S.profile = snap.data();
      if ((S.profile.role === "admin" || S.profile.role === "super_admin") && S.profile.status === "approved") {
        subscribeAdminData();
      }
    }
    routeView();
    render();
  });
  routeView();
  render();
});

function routeView() {
  if (!S.profile) { S.view = "auth"; return; }
  if (S.profile.status === "rejected") { S.view = "rejected"; return; }
  if (S.profile.status === "pending") { S.view = "pending"; return; }
  if (S.profile.role === "admin" || S.profile.role === "super_admin") { S.view = "admin"; return; }
  S.view = "member";
}

/* ============================================================
   8) إجراءات المسؤولين (موافقة / رفض / صلاحيات / الاستبيان)
   ============================================================ */

async function approveUser(u, role) {
  await updateDoc(doc(db, "users", u.id), {
    status: "approved", role, approvedBy: S.profile.email, approvedAt: serverTimestamp()
  });
  showToast(`تمت الموافقة على ${u.name} كـ ${role === "admin" ? "مسؤول" : "عضو"}`);
}
async function rejectUser(u) {
  await updateDoc(doc(db, "users", u.id), { status: "rejected", approvedBy: S.profile.email, approvedAt: serverTimestamp() });
  showToast(`تم رفض طلب ${u.name}`);
}
async function changeRole(u, role) {
  await updateDoc(doc(db, "users", u.id), { role });
  showToast(`تم تحديث صلاحية ${u.name}`);
}
async function toggleSurvey(active) {
  await setDoc(doc(db, "settings", "survey"), { active, updatedBy: S.profile.email, updatedAt: serverTimestamp() }, { merge: true });
}

/* ============================================================
   9) تدفّق العضو: التعهد → اختيار المعدة → الاستبيان → الإرسال
   ============================================================ */

function resetMemberFlow() {
  setState({ memberFlow: "pledge", pledgeChecked: false, selectedEquip: null, answers: {}, generalNotes: "", equipSearch: "" });
}

function pickEquipment(eq) {
  const answers = {};
  getSurveyTemplate(eq.size).forEach(sec => sec.items.forEach(it => {
    answers[it.key] = { status: it.type === "select" ? "" : "ok", remark: "", photoUrl: "" };
  }));
  setState({ selectedEquip: eq, answers, memberFlow: "survey" });
}

function setAnswerStatus(key, status) {
  S.answers[key] = { ...(S.answers[key] || {}), status };
  render();
}
function setAnswerRemark(key, remark) {
  S.answers[key] = { ...(S.answers[key] || {}), remark };
}
function setAnswerSelect(key, val) {
  S.answers[key] = { ...(S.answers[key] || {}), status: val };
  render();
}

async function attachPhoto(key, file) {
  if (!file) return;
  showToast("جارِ رفع الصورة…");
  try {
    const path = `submissions/${S.user.uid}/${Date.now()}_${key}_${file.name}`;
    const r = sref(storage, path);
    await uploadBytes(r, file);
    const url = await getDownloadURL(r);
    S.answers[key] = { ...(S.answers[key] || {}), photoUrl: url };
    showToast("تم إرفاق الصورة");
    render();
  } catch (e) {
    showToast("تعذّر رفع الصورة، حاول مجدداً");
  }
}
function removePhoto(key) {
  S.answers[key] = { ...(S.answers[key] || {}), photoUrl: "" };
  render();
}

async function submitSurvey() {
  if (S.submitBusy) return;
  setState({ submitBusy: true });
  try {
    const eq = S.selectedEquip;
    await addDoc(collection(db, "submissions"), {
      uid: S.user.uid,
      userName: S.profile.name,
      userEmail: S.profile.email,
      equipmentCode: eq.code,
      plate: eq.plate_ar,
      size: eq.size,
      zone: eq.zone || "",
      answers: S.answers,
      generalNotes: S.generalNotes || "",
      pledgeAccepted: true,
      createdAt: serverTimestamp(),
    });
    setState({ memberFlow: "done", submitBusy: false });
  } catch (e) {
    setState({ submitBusy: false });
    showToast("تعذّر إرسال الاستبيان، تحقق من الاتصال وحاول مجدداً");
  }
}

const appEl = document.getElementById("app");

function render() {
  let html = "";
  if (S.view === "loading") html = renderLoading();
  else if (S.view === "auth") html = renderTopbar(false) + renderAuth();
  else if (S.view === "pending") html = renderTopbar(true) + renderPendingScreen();
  else if (S.view === "rejected") html = renderTopbar(true) + renderRejectedScreen();
  else if (S.view === "member") html = renderTopbar(true) + renderMember();
  else if (S.view === "admin") html = renderTopbar(true) + renderAdmin();

  if (S.toast) html += `<div class="toast">${esc(S.toast)}</div>`;
  appEl.innerHTML = html;
  bindEvents();
}

function renderLoading() {
  return `<div class="center-screen"><div style="text-align:center">

function renderEquipPick() {

      normalizeSearch(e.code).includes(nq) ||
      normalizeSearch(e.plate_ar).includes(nq) ||

}

function statusTag(s) {
  if (s === "approved") return `<span class="tag ok">مفعّل</span>`;
  if (s === "pending") return `<span class="tag pending">بانتظار الموافقة</span>`;
  return `<span class="tag rejected">مرفوض</span>`;
}
function roleTag(r) {
  if (r === "super_admin") return `<span class="tag super">المسؤول الأعلى</span>`;
  if (r === "admin") return `<span class="tag admin">مسؤول</span>`;
  return `<span class="tag member">عضو</span>`;
}

function renderAdminFiles() {
  if (S.filesSelectedSub) {
    const sub = S.allSubmissions.find(s => s.id === S.filesSelectedSub);
    return `<div class="card">
      <button class="link-btn" data-act="backToUserFile">← رجوع لملف ${esc(sub.userName)}</button>
      <div class="divider"></div>
      ${submissionDetailHtml(sub)}
    </div>`;
  }
  if (S.filesSelectedUser) {
    const u = S.allUsers.find(x => x.id === S.filesSelectedUser);
    const subs = S.allSubmissions.filter(s => s.uid === S.filesSelectedUser);
    return `<div class="card">
      <button class="link-btn" data-act="backToFilesList">← رجوع لكل الملفات</button>
      <h2 style="margin-top:10px">ملف: ${esc(u ? u.name : "")}</h2>
      <p class="muted">${subs.length} استبيان محفوظ</p>
      <div class="divider"></div>
      ${subs.length === 0 ? `<p class="muted">لا يوجد استبيانات بعد</p>` : subs.map(s => `
      <div class="list-row">
        <div class="main">
          <div class="t1">${esc(s.equipmentCode)} — ${esc(s.plate || "")}</div>
          <div class="t2">${fmtDate(s.createdAt)} · ${s.size} طن</div>
        </div>
        <div class="acts"><button class="btn outline sm" data-act="viewSub" data-id="${s.id}">عرض التفاصيل</button></div>
      </div>`).join("")}
    </div>`;
  }
  // قائمة كل المستخدمين (الملفات)
  const usersWithCounts = S.allUsers.filter(u => u.status === "approved").map(u => ({
    ...u, count: S.allSubmissions.filter(s => s.uid === u.id).length
  }));
  return `<div class="card">
    <p class="lead" style="margin-bottom:14px">ملفات الموظفين — لا يمكن لأي عضو الاطلاع على ملفه الخاص، هذه الصفحة مخصصة للمسؤولين فقط.</p>
    ${usersWithCounts.map(u => `
    <div class="list-row">
      <div class="main">
        <div class="t1">📁 ${esc(u.name)}</div>
        <div class="t2">${esc(u.email)} · ${u.count} استبيان</div>
      </div>
      <div class="acts"><button class="btn outline sm" data-act="openUserFile" data-id="${u.id}">فتح الملف</button></div>
    </div>`).join("")}
  </div>`;
}

function submissionDetailHtml(sub) {
  const eq = EQUIPMENT_BY_CODE[sub.equipmentCode] || {};
  const sections = getSurveyTemplate(sub.size);
  return `
  <h2>استبيان ${esc(sub.equipmentCode)}</h2>
  <p class="muted">${esc(sub.userName)} · ${fmtDate(sub.createdAt)} · ${sub.size} طن ${eq.zone ? "· " + esc(eq.zone) : ""}</p>
  <div class="divider"></div>
  ${sections.map(sec => `
    <div class="section-block">
      <div class="section-title">${esc(sec.title)}</div>
      ${sec.items.map(it => {
        const a = (sub.answers || {})[it.key] || {};
        const isIssue = a.status === "issue";
        return `
        <div class="q-row">
          <div class="q-top">
            <div class="q-text">${esc(it.ar)}</div>
            ${it.type === "select" ? `<span class="tag ${a.status ? "ok" : "issue"}">${esc(a.status || "—")}</span>`
              : `<span class="tag ${isIssue ? "issue" : "ok"}">${isIssue ? "✗ ملاحظة" : "✓ سليم"}</span>`}
          </div>
          ${a.remark ? `<div class="muted">${esc(a.remark)}</div>` : ""}
          ${a.photoUrl ? `<div class="photo-row"><a href="${esc(a.photoUrl)}" target="_blank"><img class="photo-thumb" src="${esc(a.photoUrl)}"></a></div>` : ""}
        </div>`;
      }).join("")}
    </div>
  `).join("")}
  ${sub.generalNotes ? `<div class="msg info" style="white-space:pre-line">${esc(sub.generalNotes)}</div>` : ""}
  `;
}

function renderAdminEquipment() {
  const q = S.adminEquipSearch.trim();
  const nq = normalizeSearch(q);
  const results = q ? EQUIPMENT.filter(e =>
    normalizeSearch(e.code).includes(nq) || normalizeSearch(e.plate_ar).includes(nq) ||
    normalizeSearch(e.chassis).includes(nq) || normalizeSearch(e.zone).includes(nq)
  ).slice(0, 40) : EQUIPMENT.slice(0, 40);
  return `<div class="card">
    <div class="kpi-grid">
      <div class="kpi"><div class="n">${EQUIPMENT.length}</div><div class="l">إجمالي المعدات</div></div>
      <div class="kpi"><div class="n">${EQUIPMENT.filter(e => e.size === 19).length}</div><div class="l">19 طن</div></div>
      <div class="kpi"><div class="n">${EQUIPMENT.filter(e => e.size === 30).length}</div><div class="l">30 طن</div></div>
      <div class="kpi"><div class="n">${EQUIPMENT.filter(e => e.condition !== "سليمة").length}</div><div class="l">تحتاج متابعة</div></div>
    </div>
    <div class="searchbar">
      <input type="text" id="adminEquipSearchInput" placeholder="ابحث بالكود أو اللوحة أو البلدية…" value="${esc(S.adminEquipSearch)}">
      <span class="ic">🔍</span>
    </div>
    <div id="adminEquipResults">${results.map(e => `
      <div class="equip-card" data-act="viewEquipDetail" data-code="${esc(e.code)}" style="margin-bottom:8px">
        ${equipDetailToggleHtml(e)}
      </div>`).join("")}
    </div>
  </div>`;
}
function equipDetailToggleHtml(e) {
  const open = S._openEquip === e.code;
  return `
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span class="code">${esc(e.code)}</span>
    <span class="size-pill ${e.size === 30 ? "t30" : ""}">${e.size} طن</span>
  </div>
  <div class="row2"><span>🚛 ${esc(e.plate_ar)}</span><span>📍 ${esc(e.zone || "—")}</span></div>
  ${open ? `<div class="divider"></div>${equipDetailHtml(e)}` : ""}
  `;
}

function renderAdminSurvey() {
  return `<div class="card">
    <h2>حالة الاستبيان</h2>
    <p class="lead">عند التفعيل، يستطيع الأعضاء الدخول وتعبئة استبيان الفحص. عند الإيقاف تظهر لهم رسالة "لا يوجد استبيان".</p>
    <div class="msg ${S.surveyActive ? "success" : "info"}">
      الحالة الحالية: ${S.surveyActive ? "مفعّل ✅" : "غير مفعّل ⏸️"}
    </div>
    <button class="btn ${S.surveyActive ? "danger" : ""}" data-act="toggleSurvey" data-val="${S.surveyActive ? "off" : "on"}">
      ${S.surveyActive ? "إيقاف الاستبيان" : "تفعيل الاستبيان"}
    </button>
  </div>`;
}

/* ============================================================
   11) ربط الأحداث (Event delegation)
   ============================================================ */

function bindEvents() {
  const authForm = document.getElementById("authForm");
  if (authForm) {
    authForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("f_email").value;
      const pass = document.getElementById("f_pass").value;
      if (S.authMode === "login") handleLogin(email, pass);
      else handleRegister(document.getElementById("f_name").value, email, pass);
    });
  }

  const equipInput = document.getElementById("equipSearchInput");
  if (equipInput) {
    equipInput.addEventListener("input", (e) => {
      S.equipSearch = e.target.value;
      const wrap = document.getElementById("equipResults");
      const q = S.equipSearch.trim();
      let html;
      if (q.length < 1) html = `<p class="muted">ابدأ الكتابة لعرض النتائج…</p>`;
      else {
        const nq = normalizeSearch(q);
        const results = EQUIPMENT.filter(x =>
          normalizeSearch(x.code).includes(nq) || normalizeSearch(x.plate_ar).includes(nq) ||
          normalizeSearch(x.plate_en).includes(nq) || normalizeSearch(x.chassis).includes(nq) ||
          normalizeSearch(x.zone).includes(nq)
        ).slice(0, 30);
        html = results.length === 0 ? `<div class="empty"><div class="big">🔎</div><p>لا توجد نتائج مطابقة</p></div>` : results.map(equipCardHtml).join("");
      }
      wrap.innerHTML = html;
      bindDynamicClicks(wrap);
    });
  }

  const adminEquipInput = document.getElementById("adminEquipSearchInput");
  if (adminEquipInput) {
    adminEquipInput.addEventListener("input", (e) => { S.adminEquipSearch = e.target.value; render(); });
    // keep focus after re-render
    adminEquipInput.focus();
    adminEquipInput.selectionStart = adminEquipInput.selectionEnd = adminEquipInput.value.length;
  }

  const pledgeChk = document.getElementById("pledgeChk");
  if (pledgeChk) pledgeChk.addEventListener("change", (e) => { S.pledgeChecked = e.target.checked; render(); });

  const generalNotes = document.getElementById("generalNotes");
  if (generalNotes) generalNotes.addEventListener("input", (e) => { S.generalNotes = e.target.value; });

  document.querySelectorAll("[data-remark]").forEach(el => {
    el.addEventListener("input", (e) => setAnswerRemark(el.dataset.remark, e.target.value));
  });
  document.querySelectorAll("[data-select]").forEach(el => {
    el.addEventListener("change", (e) => setAnswerSelect(el.dataset.select, e.target.value));
  });
  document.querySelectorAll("[data-photo]").forEach(el => {
    el.addEventListener("change", (e) => { if (e.target.files[0]) attachPhoto(el.dataset.photo, e.target.files[0]); });
  });
  document.querySelectorAll("[data-changerole]").forEach(el => {
    el.addEventListener("change", (e) => {
      const u = S.allUsers.find(x => x.id === el.dataset.changerole);
      if (u) changeRole(u, e.target.value);
    });
  });

  bindDynamicClicks(appEl);
}

function bindDynamicClicks(root) {
  root.querySelectorAll("[data-act]").forEach(el => {
    if (el._bound) return;
    el._bound = true;
    el.addEventListener("click", (e) => {
      const act = el.dataset.act;
      if (act === "logout") return handleLogout();
      if (act === "switchAuth") return setState({ authMode: S.authMode === "login" ? "register" : "login", authError: "" });
      if (act === "forgotPass") {
        const email = prompt("أدخل بريدك الإلكتروني لإرسال رابط إعادة تعيين كلمة المرور:");
        if (email) sendPasswordResetEmail(auth, email.trim())
          .then(() => showToast("تم إرسال رابط إعادة التعيين إلى بريدك"))
          .catch(() => showToast("تعذّر إرسال الرابط، تحقق من البريد"));
        return;
      }
      if (act === "acceptPledge") return setState({ memberFlow: "pick" });
      if (act === "pickEquip") {
        const eq = EQUIPMENT_BY_CODE[el.dataset.code];
        if (eq) pickEquipment(eq);
        return;
      }
      if (act === "changeEquip") return setState({ memberFlow: "pick", selectedEquip: null });
      if (act === "qstatus") return; // handled below explicitly
      if (act === "removePhoto") return removePhoto(el.dataset.key);
      if (act === "submitSurvey") return submitSurvey();
      if (act === "newSurvey") return resetMemberFlow();

      if (act === "adminTab") return setState({ adminTab: el.dataset.tab, filesSelectedUser: null, filesSelectedSub: null, _openEquip: null });
      if (act === "approve") {
        const u = S.pendingUsers.find(x => x.id === el.dataset.id);
        if (u) approveUser(u, el.dataset.role);
        return;
      }
      if (act === "reject") {
        const u = S.pendingUsers.find(x => x.id === el.dataset.id);
        if (u && confirm(`هل أنت متأكد من رفض طلب ${u.name}؟`)) rejectUser(u);
        return;
      }
      if (act === "openUserFile") return setState({ filesSelectedUser: el.dataset.id, filesSelectedSub: null });
      if (act === "backToFilesList") return setState({ filesSelectedUser: null, filesSelectedSub: null });
      if (act === "backToUserFile") return setState({ filesSelectedSub: null });
      if (act === "viewSub") return setState({ filesSelectedSub: el.dataset.id });
      if (act === "viewEquipDetail") {
        S._openEquip = S._openEquip === el.dataset.code ? null : el.dataset.code;
        return render();
      }
      if (act === "toggleSurvey") return toggleSurvey(el.dataset.val === "on");
    });
  });

  // أزرار سليم/ملاحظة (تحتاج معالجة خاصة لأنها قد تتكرر بنفس data-act)
  root.querySelectorAll("[data-qstatus]").forEach(el => {
    if (el._bound2) return;
    el._bound2 = true;
    el.addEventListener("click", () => setAnswerStatus(el.dataset.qstatus, el.dataset.val));
  });
}

render();

</script>
